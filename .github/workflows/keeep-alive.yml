name: 仓库保活｜防止定时任务休眠
on:
  schedule:
    # 每15天 UTC12点 = 北京时间20点
    - cron: '0 12 */15 * *'
  workflow_dispatch:

jobs:
  keep‑alive:
    runs‑on: ubuntu‑latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 空提交保活，无文件改动
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git commit --allow-empty -m "chore: 15天周期仓库保活 [auto]"
          git push
