name: 每日历史稿件生成任务
on:
  schedule:
    # UTC时间21点 = 北京时间次日05点
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  generate-article:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置JDK17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Maven编译打包
        run: mvn clean package -DskipTests

      - name: 运行Java程序
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
        run: java -jar target/history-article-generator-1.0-SNAPSHOT-jar-with-dependencies.jar

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: history-article-output
          path: output/
